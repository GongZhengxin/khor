name: DSH integration

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml
  native:
    needs: frontend
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Isolate build and runtime paths
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/dsh-target"
            echo "KHOR_AGENT_BUNDLE=$RUNNER_TEMP/khor-agent"
            echo "KHOR_TEST_MCP_EXECUTABLE=$RUNNER_TEMP/dsh-target/debug/khor"
            echo "KHOR_RUNTIME_DIR=$RUNNER_TEMP/dsh-runtime"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: dsh-integration
          cache-targets: false
      - run: npm ci --prefix apps/agent
      - name: Embed the real Khor agent
        run: node apps/agent/build.mjs aarch64-apple-darwin "$KHOR_AGENT_BUNDLE"
      - uses: ./.github/actions/restore-frontend
      - name: Check formatting and retain a source-only repair patch
        id: formatting
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-evidence"
          if ! python3 scripts/check-rust-format.py --check; then
            python3 scripts/check-rust-format.py --write
            git diff --binary -- '*.rs' > "$RUNNER_TEMP/dsh-evidence/format.patch"
            git restore -- '*.rs'
            exit 1
          fi
      - name: Prove the optional-installation regression before checking its fix
        run: |
          mkdir -p "$RUNNER_TEMP/empty-agent-path"
          cp crates/node/src/doctor.rs "$RUNNER_TEMP/doctor.green.rs"
          trap 'cp "$RUNNER_TEMP/doctor.green.rs" crates/node/src/doctor.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/node/src/doctor.rs')
          source = path.read_text()
          green = 'let Ok(rows) = node.agents_loaded().map(|loaded| loaded.doc.all()) else {'
          assert source.count(green) == 1
          path.write_text(source.replace(green, 'let Ok(rows) = node.agents() else {'))
          PY
          git diff -- crates/node/src/doctor.rs > "$RUNNER_TEMP/dsh-evidence/doctor-red.patch"
          set +e
          KHOR_PATH="$RUNNER_TEMP/empty-agent-path" cargo test --locked -p khor-node --lib doctor::agent_tests -- --test-threads=1 --color never > "$RUNNER_TEMP/dsh-evidence/doctor-red.log" 2>&1
          red_status=$?
          set -e
          cp "$RUNNER_TEMP/doctor.green.rs" crates/node/src/doctor.rs
          test "$red_status" -ne 0
          grep -F 'dsh_default_is_optional_but_an_explicit_missing_agent_is_diagnosed ... FAILED' "$RUNNER_TEMP/dsh-evidence/doctor-red.log"
          git diff --exit-code -- crates/node/src/doctor.rs
      - name: Build the exact CLI for isolated local DSH acceptance
        id: native_build
        run: |
          cargo build --locked -p khor-cli --bin khor -p khor-gui-core --bin bridge
          cp "$CARGO_TARGET_DIR/debug/khor" "$RUNNER_TEMP/dsh-evidence/khor"
          cp "$CARGO_TARGET_DIR/debug/bridge" "$RUNNER_TEMP/dsh-evidence/bridge"
          git rev-parse HEAD > "$RUNNER_TEMP/dsh-evidence/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/dsh-evidence/source-tree.txt"
          shasum -a 256 "$RUNNER_TEMP/dsh-evidence/khor" "$RUNNER_TEMP/dsh-evidence/bridge" > "$RUNNER_TEMP/dsh-evidence/binaries.sha256"
      - name: Verify default discovery and launch ownership
        run: |
          cargo test --locked -p khor-node --lib dsh_is_available_without_registration -- --test-threads=1
          KHOR_PATH="$RUNNER_TEMP/empty-agent-path" cargo test --locked -p khor-node --lib doctor::agent_tests -- --test-threads=1
          cargo test --locked -p khor-sync --lib agents -- --test-threads=1
          cargo test --locked -p khor-gui-core --lib agents::tests -- --test-threads=1
          cargo test --locked -p khor-cli --test far_open -- --test-threads=1
      - name: Verify ACP configuration, permissions, cancellation and recovery
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: cargo test --locked -p khor-acp --test conversation -- --test-threads=1
      - name: Verify the real Khor agent delegation path
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: cargo test --locked -p khor-node --test delegation_wire -- --test-threads=1
      - name: Require clean formatting
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.formatting.outcome }}
        run: test "$FORMAT_OUTCOME" = success
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dsh-integration-native
          path: ${{ runner.temp }}/dsh-evidence
          if-no-files-found: error
          retention-days: 7
