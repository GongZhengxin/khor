name: Windows desktop validation

on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Windows validation run ID whose existing MSI should be tested again
        type: string
      retry_runner:
        description: Runner for testing an existing MSI
        type: choice
        default: windows-2025
        options: [windows-2025, windows-2022]
  push:
    branches: ['verify/windows-desktop-*']

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-desktop-${{ github.ref }}-${{ inputs.package_run || 'build' }}-${{ inputs.retry_runner || 'default' }}
  cancel-in-progress: true

jobs:
  frontend:
    if: ${{ !inputs.package_run }}
    uses: ./.github/workflows/frontend.yml
  windows:
    needs: frontend
    uses: ./.github/workflows/windows-desktop.yml
  existing-package:
    if: ${{ inputs.package_run != '' }}
    runs-on: ${{ inputs.retry_runner || 'windows-2025' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: khor-windows-x86_64-app
          path: desktop-product
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
      - run: npm ci --prefix apps/gui
      - name: Verify the existing MSI and native interaction
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        run: |
          $source = gh run view $env:PACKAGE_RUN --repo $env:GITHUB_REPOSITORY --json headSha --jq .headSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_manifest.py verify --root desktop-product --sha $source --run-id $env:PACKAGE_RUN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-desktop-installer.py --package desktop-product/khor-windows-x86_64.msi --output "$env:RUNNER_TEMP/installation.json" --expected-source $source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-installer-retry-evidence
          path: |
            ${{ runner.temp }}/installation.json
            ${{ runner.temp }}/khor-installer-logs/*.log
          if-no-files-found: warn
          retention-days: 14
